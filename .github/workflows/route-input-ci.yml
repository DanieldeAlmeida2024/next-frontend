name: next-frontend - contratos de rotas e validação TypeScript
on:
  pull_request:
  push:
    branches: [main, fix/routes-input-validation-upstream-errors-20261112]
permissions:
  contents: read
jobs:
  route-input:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Inventário separado de dependências npm (não ignorar auditoria indisponível)
        shell: bash
        run: |
          npm audit --json > audit-full.json || true
          npm audit --omit=dev --json > audit-runtime.json || true
          node -e 'const fs=require("fs"); for (const [kind,file] of [["full","audit-full.json"],["runtime","audit-runtime.json"]]) { const a=JSON.parse(fs.readFileSync(file,"utf8")); const v=a.metadata?.vulnerabilities; if (!v || typeof v.total!=="number") throw new Error("Auditoria npm "+kind+" indisponível"); console.log("npm audit "+kind+": "+JSON.stringify(v)); }'
      - name: Preservar inventário npm
        uses: actions/upload-artifact@v4
        with:
          name: next-frontend-npm-audit
          path: |
            audit-full.json
            audit-runtime.json
          retention-days: 7
      - name: Compilar validador isolado TypeScript (sem Next nem rede)
        run: npx tsc --target ES2020 --module commonjs --lib ES2020,DOM --strict --skipLibCheck --rootDir src --outDir .test-build src/utils/route-input.ts
      - name: Testar entradas adversariais de rotas
        run: node --test tests/route-input.test.cjs
      - name: Inspecionar wiring de handlers e Server Actions
        run: python3 -m unittest discover -s tests -p 'test_route_wiring.py' -v
      - name: Verificar TypeScript completo
        run: npx tsc --noEmit
