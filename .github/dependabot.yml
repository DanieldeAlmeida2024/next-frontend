version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react-next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Migre Next e seu preset de lint juntos em um PR dedicado.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # Revise o preset e o formato da configuração antes de mudar o major do ESLint.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
