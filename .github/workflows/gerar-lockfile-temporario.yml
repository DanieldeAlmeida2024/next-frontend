name: Regenerar lockfile da atualização de segurança (temporário)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lockfile:
    if: github.head_ref == 'fix/auditoria-entrevista-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Atualizar manifesto e lockfile juntos (sem postinstall)
        run: |
          npm install --ignore-scripts --save-exact next@15.5.29 react@19.3.1 react-dom@19.3.1
          npm install --ignore-scripts --save-exact --save-dev eslint-config-next@15.5.29 @types/react@19 @types/react-dom@19
      - name: Expor somente arquivos de dependências para revisão
        run: |
          echo '<<<BEGIN_PACKAGE_JSON>>>'
          cat package.json
          echo '<<<END_PACKAGE_JSON>>>'
          echo '<<<BEGIN_PACKAGE_LOCK_JSON>>>'
          cat package-lock.json
          echo '<<<END_PACKAGE_LOCK_JSON>>>'
