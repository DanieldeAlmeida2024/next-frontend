name: Revisar lockfile transitorio Next.js (temporario)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  corrigir-auditoria:
    if: github.head_ref == 'fix/auditoria-entrevista-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar override seguro de PostCSS e corrigir transientes
        run: |
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.overrides["minimatch@3.1.5"]={"brace-expansion":"1.1.22"};p.overrides["query-string@7.1.3"]={"decode-uri-component":"0.5.1"};fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\\n")'
          npm install --ignore-scripts
          npm audit fix --ignore-scripts || echo 'Auditoria ainda pode ter alertas; gate principal permanece obrigatório.'
          npm audit --audit-level=high || true
          npm run build || true
      - name: Expor somente metadados de dependencias regenerados
        run: |
          echo '<<<BEGIN_PACKAGE_JSON>>>'
          cat package.json
          echo '<<<END_PACKAGE_JSON>>>'
          echo '<<<BEGIN_PACKAGE_LOCK_JSON>>>'
          cat package-lock.json
          echo '<<<END_PACKAGE_LOCK_JSON>>>'
